name: Unity static validation

on:
  push:
    branches: [unity-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Unity project structure and C# syntax balance
        run: python Tools/validate_project.py
