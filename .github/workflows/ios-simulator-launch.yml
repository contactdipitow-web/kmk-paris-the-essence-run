name: Launch KMK Paris on iOS Simulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-simulator-launch.yml"

permissions:
  contents: read

concurrency:
  group: kmk-ios-simulator-launch
  cancel-in-progress: false

jobs:
  launch-ios:
    name: Build, install and launch on iPhone Simulator
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_GIT_STATUS: "1"
      BUNDLE_ID: com.kmkparis.theessencerun
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

    steps:
      - name: Checkout KMK source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Validate TypeScript and Expo configuration
        run: |
          npx tsc --noEmit
          npx expo-doctor@latest

      - name: Show iOS toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          pod --version

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Discover Xcode workspace and scheme
        id: native
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No Xcode workspace was generated."
            exit 1
          fi

          xcodebuild -workspace "$WORKSPACE" -list -json > "$RUNNER_TEMP/xcode-list.json"
          SCHEME="$(python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'xcode-list.json')) as handle:
              data = json.load(handle)
          schemes = data.get('workspace', {}).get('schemes', [])
          if not schemes:
              raise SystemExit('No Xcode scheme found')
          print(schemes[0])
          PY
          )"

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Select and boot an iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          read -r UDID DEVICE_NAME RUNTIME <<< "$(python3 - <<'PY'
          import json, os, re
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'simulators.json')) as handle:
              data = json.load(handle)

          candidates = []
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              version_match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              version = tuple(map(int, version_match.groups())) if version_match else (0, 0)
              for device in devices:
                  name = device.get('name', '')
                  if device.get('isAvailable') and name.startswith('iPhone'):
                      priority = 2 if 'Pro Max' in name else 1 if 'Pro' in name else 0
                      candidates.append((version, priority, name, device['udid'], runtime))

          if not candidates:
              raise SystemExit('No available iPhone Simulator found')

          version, _, name, udid, runtime = sorted(candidates, reverse=True)[0]
          print(udid, name.replace(' ', '_'), runtime)
          PY
          )"

          DEVICE_NAME="${DEVICE_NAME//_/ }"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $DEVICE_NAME ($UDID)"

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Compile Release app for selected iPhone Simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace "${{ steps.native.outputs.workspace }}" \
            -scheme "${{ steps.native.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            clean build | tee build/xcodebuild-ios-simulator.log

      - name: Install and launch KMK Paris
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$DERIVED_DATA/Build/Products" -type d -name '*.app' -path '*Release-iphonesimulator*' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::The compiled .app bundle was not found."
            find "$DERIVED_DATA/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi

          echo "Compiled app: $APP_PATH"
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "$APP_PATH"
          LAUNCH_OUTPUT="$(xcrun simctl launch --terminate-running-process "${{ steps.simulator.outputs.udid }}" "$BUNDLE_ID")"
          echo "$LAUNCH_OUTPUT"
          PID="$(echo "$LAUNCH_OUTPUT" | awk -F': ' 'NF > 1 {print $2}' | tail -1)"
          if [ -z "$PID" ]; then
            echo "::error::The simulator did not return an app process identifier."
            exit 1
          fi

          echo "pid=$PID" >> "$GITHUB_OUTPUT"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          sleep 12

          mkdir -p build/ios-launch
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot build/ios-launch/kmk-paris-ios-launched.png
          ditto -c -k --keepParent "$APP_PATH" build/ios-launch/KMK-Paris-The-Essence-Run-iOS-Simulator.app.zip
          printf '%s\n' \
            "Simulator=${{ steps.simulator.outputs.name }}" \
            "Runtime=${{ steps.simulator.outputs.runtime }}" \
            "BundleID=$BUNDLE_ID" \
            "PID=$PID" \
            "Commit=${{ github.sha }}" \
            > build/ios-launch/launch-proof.txt

      - name: Publish launch result
        if: success()
        shell: bash
        run: |
          {
            echo "## KMK Paris — iOS Simulator"
            echo "- Result: compiled, installed and launched successfully"
            echo "- Device: ${{ steps.simulator.outputs.name }}"
            echo "- Runtime: ${{ steps.simulator.outputs.runtime }}"
            echo "- Bundle ID: \`$BUNDLE_ID\`"
            echo "- Process ID: \`${{ steps.launch.outputs.pid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload launch proof and Simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmk-paris-ios-simulator-launch
          path: |
            build/ios-launch/**
            build/xcodebuild-ios-simulator.log
          if-no-files-found: warn
          retention-days: 7

      - name: Shutdown Simulator
        if: always()
        shell: bash
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" 2>/dev/null || true
