name: Launch KMK Paris on iOS Simulator V5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-simulator-launch-v5.yml"

permissions:
  contents: read

concurrency:
  group: kmk-ios-simulator-launch-v5
  cancel-in-progress: false

jobs:
  launch-ios:
    name: Build and launch the KMK app on iPhone
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_GIT_STATUS: "1"
      EXPECTED_BUNDLE_ID: com.kmkparis.theessencerun
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo project
        run: |
          npx tsc --noEmit
          npx expo-doctor@latest

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Discover the application workspace and scheme
        id: native
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$WORKSPACE" || { echo "::error::No application Xcode workspace generated"; exit 1; }
          test -n "$PROJECT" || { echo "::error::No application Xcode project generated"; exit 1; }

          APP_PROJECT_NAME="$(basename "$PROJECT" .xcodeproj)"
          xcodebuild -project "$PROJECT" -list -json > "$RUNNER_TEMP/app-project-list.json"

          SCHEME="$(APP_PROJECT_NAME="$APP_PROJECT_NAME" python3 - <<'PY'
          import json, os

          with open(os.path.join(os.environ['RUNNER_TEMP'], 'app-project-list.json')) as handle:
              data = json.load(handle)

          schemes = data.get('project', {}).get('schemes', [])
          expected = os.environ['APP_PROJECT_NAME']
          if expected in schemes:
              print(expected)
          else:
              candidates = [s for s in schemes if not s.lower().startswith('pods') and 'test' not in s.lower()]
              if not candidates:
                  raise SystemExit(f'No application scheme found. Available schemes: {schemes}')
              print(candidates[0])
          PY
          )"

          test "$SCHEME" != "EXConstants" || { echo "::error::A CocoaPods scheme was selected instead of the application"; exit 1; }
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Application workspace: $WORKSPACE"
          echo "Application project: $PROJECT"
          echo "Application scheme: $SCHEME"

      - name: Create and boot a fresh iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/runtimes.json"
          xcrun simctl list devicetypes -j > "$RUNNER_TEMP/devicetypes.json"

          read -r RUNTIME_ID RUNTIME_NAME DEVICE_TYPE_ID DEVICE_NAME <<< "$(python3 - <<'PY'
          import json, os, re

          temp = os.environ['RUNNER_TEMP']
          with open(os.path.join(temp, 'runtimes.json')) as handle:
              runtime_data = json.load(handle)
          with open(os.path.join(temp, 'devicetypes.json')) as handle:
              device_data = json.load(handle)

          runtimes = []
          for runtime in runtime_data.get('runtimes', []):
              name = runtime.get('name', '')
              if not name.startswith('iOS') or not runtime.get('isAvailable', False):
                  continue
              match = re.search(r'(\d+)(?:\.(\d+))?', name)
              version = (int(match.group(1)), int(match.group(2) or 0)) if match else (0, 0)
              runtimes.append((version, runtime['identifier'], name))
          if not runtimes:
              raise SystemExit('No available iOS runtime')
          _, runtime_id, runtime_name = sorted(runtimes, reverse=True)[0]

          phones = [d for d in device_data.get('devicetypes', []) if d.get('name', '').startswith('iPhone')]
          if not phones:
              raise SystemExit('No iPhone device type')
          preferred = [d for d in phones if 'Pro' in d['name'] and 'Max' not in d['name']]
          chosen = sorted(preferred or phones, key=lambda d: d['name'], reverse=True)[0]
          print(runtime_id, runtime_name.replace(' ', '_'), chosen['identifier'], chosen['name'].replace(' ', '_'))
          PY
          )"

          RUNTIME_NAME="${RUNTIME_NAME//_/ }"
          DEVICE_NAME="${DEVICE_NAME//_/ }"
          SIMULATOR_NAME="KMK Paris CI iPhone $GITHUB_RUN_ID"
          UDID="$(xcrun simctl create "$SIMULATOR_NAME" "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
          test -n "$UDID" || { echo "::error::Unable to create the iPhone Simulator"; exit 1; }

          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME_NAME" >> "$GITHUB_OUTPUT"
          echo "Created: $DEVICE_NAME / $RUNTIME_NAME / $UDID"

          SIMULATOR_UDID="$UDID" python3 - <<'PY'
          import json, os, subprocess, sys, time

          udid = os.environ['SIMULATOR_UDID']
          try:
              boot = subprocess.run(
                  ['xcrun', 'simctl', 'boot', udid],
                  text=True,
                  capture_output=True,
                  timeout=30,
              )
              combined = (boot.stdout or '') + (boot.stderr or '')
              if boot.returncode and 'Booted' not in combined:
                  print(combined)
          except subprocess.TimeoutExpired:
              print('simctl boot timed out; polling the simulator state directly.')

          deadline = time.time() + 240
          last_state = None
          while time.time() < deadline:
              result = subprocess.run(['xcrun', 'simctl', 'list', 'devices', '-j'], text=True, capture_output=True)
              data = json.loads(result.stdout)
              state = None
              for devices in data.get('devices', {}).values():
                  for device in devices:
                      if device.get('udid') == udid:
                          state = device.get('state')
                          break
                  if state:
                      break
              if state != last_state:
                  print(f'Simulator state: {state}')
                  last_state = state
              if state == 'Booted':
                  ready = subprocess.run(
                      ['xcrun', 'simctl', 'spawn', udid, 'launchctl', 'print', 'system'],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if ready.returncode == 0:
                      print('Simulator services are ready.')
                      sys.exit(0)
              time.sleep(3)

          raise SystemExit('Fresh iPhone Simulator did not become ready')
          PY

      - name: Build the actual KMK application in Release mode
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace "${{ steps.native.outputs.workspace }}" \
            -scheme "${{ steps.native.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            clean build | tee build/xcodebuild-ios-simulator.log

      - name: Resolve the application bundle from Xcode build settings
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios-launch

          xcodebuild \
            -workspace "${{ steps.native.outputs.workspace }}" \
            -scheme "${{ steps.native.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings -json > build/ios-launch/xcode-build-settings.json

          RESOLVED="$(EXPECTED_BUNDLE_ID="$EXPECTED_BUNDLE_ID" python3 - <<'PY'
          import json, os

          with open('build/ios-launch/xcode-build-settings.json') as handle:
              entries = json.load(handle)

          expected = os.environ['EXPECTED_BUNDLE_ID']
          applications = []
          for entry in entries:
              settings = entry.get('buildSettings', {})
              if settings.get('WRAPPER_EXTENSION') != 'app':
                  continue
              target_dir = settings.get('TARGET_BUILD_DIR')
              wrapper = settings.get('WRAPPER_NAME')
              bundle_id = settings.get('PRODUCT_BUNDLE_IDENTIFIER', '')
              if target_dir and wrapper:
                  applications.append((bundle_id, os.path.join(target_dir, wrapper)))

          if not applications:
              raise SystemExit('Xcode did not report an application product')

          exact = [item for item in applications if item[0] == expected]
          bundle_id, app_path = (exact or applications)[0]
          print(f'{bundle_id}\t{app_path}')
          PY
          )"

          ACTUAL_BUNDLE_ID="${RESOLVED%%$'\t'*}"
          APP_PATH="${RESOLVED#*$'\t'}"
          test -d "$APP_PATH" || {
            echo "::error::Resolved application bundle does not exist: $APP_PATH"
            find "$DERIVED_DATA/Build/Products" -type d -name '*.app' -print || true
            exit 1
          }

          INFO_PLIST="$APP_PATH/Info.plist"
          PLIST_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          test -n "$PLIST_BUNDLE_ID" || { echo "::error::Compiled bundle identifier is empty"; exit 1; }
          ACTUAL_BUNDLE_ID="$PLIST_BUNDLE_ID"

          if [ "$ACTUAL_BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::warning::Compiled bundle ID is $ACTUAL_BUNDLE_ID; expected $EXPECTED_BUNDLE_ID"
          fi

          ditto -c -k --keepParent "$APP_PATH" build/ios-launch/KMK-Paris-The-Essence-Run-iOS-Simulator.app.zip
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$ACTUAL_BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved KMK app: $APP_PATH"
          echo "Resolved bundle ID: $ACTUAL_BUNDLE_ID"

      - name: Install, launch and verify KMK Paris
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          APP_PATH="${{ steps.bundle.outputs.app_path }}"
          BUNDLE_ID="${{ steps.bundle.outputs.bundle_id }}"
          mkdir -p build/ios-launch

          xcrun simctl uninstall "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl install "$UDID" "$APP_PATH"
          INSTALLED_PATH="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" app)"
          test -d "$INSTALLED_PATH" || { echo "::error::KMK installation could not be verified"; exit 1; }
          echo "Installed at: $INSTALLED_PATH"

          set +e
          LAUNCH_OUTPUT="$(xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" 2>&1)"
          LAUNCH_STATUS=$?
          set -e
          echo "$LAUNCH_OUTPUT"
          printf '%s\n' "$LAUNCH_OUTPUT" > build/ios-launch/launch-output.txt

          if [ "$LAUNCH_STATUS" -ne 0 ]; then
            xcrun simctl spawn "$UDID" log show --last 5m --style compact \
              --predicate "eventMessage CONTAINS[c] '$BUNDLE_ID' OR processImagePath CONTAINS[c] 'KMK'" \
              > build/ios-launch/simulator-error.log 2>&1 || true
            echo "::error::KMK failed to launch with status $LAUNCH_STATUS"
            exit "$LAUNCH_STATUS"
          fi

          PID="$(printf '%s\n' "$LAUNCH_OUTPUT" | sed -nE 's/^.*: ([0-9]+)$/\1/p' | tail -1)"
          sleep 15

          PROCESS_COUNT="$(xcrun simctl spawn "$UDID" ps -ax 2>/dev/null | grep -c "${APP_PATH##*/}" || true)"
          echo "Matching running processes: $PROCESS_COUNT"
          xcrun simctl io "$UDID" screenshot build/ios-launch/kmk-paris-ios-launched.png
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate "eventMessage CONTAINS[c] '$BUNDLE_ID' OR processImagePath CONTAINS[c] 'KMK'" \
            > build/ios-launch/simulator-launch.log 2>&1 || true

          printf '%s\n' \
            "Status=LAUNCHED" \
            "Simulator=${{ steps.simulator.outputs.name }}" \
            "Runtime=${{ steps.simulator.outputs.runtime }}" \
            "BundleID=$BUNDLE_ID" \
            "PID=${PID:-unknown}" \
            "InstalledPath=$INSTALLED_PATH" \
            "Commit=${{ github.sha }}" \
            > build/ios-launch/launch-proof.txt
          echo "pid=${PID:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Publish success summary
        if: success()
        shell: bash
        run: |
          {
            echo "## KMK Paris — iOS launch successful"
            echo "- Result: application compiled, installed and launched"
            echo "- Scheme: \`${{ steps.native.outputs.scheme }}\`"
            echo "- Device: ${{ steps.simulator.outputs.name }}"
            echo "- Runtime: ${{ steps.simulator.outputs.runtime }}"
            echo "- Bundle ID: \`${{ steps.bundle.outputs.bundle_id }}\`"
            echo "- Process ID: \`${{ steps.launch.outputs.pid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app, screenshot, proof and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmk-paris-ios-launch-v5
          path: |
            build/ios-launch/**
            build/xcodebuild-ios-simulator.log
          if-no-files-found: warn
          retention-days: 7

      - name: Delete fresh Simulator
        if: always()
        shell: bash
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          if [ -n "$UDID" ]; then
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            xcrun simctl delete "$UDID" 2>/dev/null || true
          fi
