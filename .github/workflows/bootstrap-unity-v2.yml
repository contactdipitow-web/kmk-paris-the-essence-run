name: Bootstrap Unity V2

on:
  push:
    branches: [unity-v2]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize Unity project
        run: python Tools/bootstrap_unity_v2.py
      - name: Validate generated project
        run: python Tools/validate_project.py
      - name: Commit Unity vertical slice
        shell: bash
        run: |
          rm -rf Tools/bootstrap_unity_v2.py Tools/.bootstrap_chunks .github/workflows/bootstrap-unity-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize Unity 3D vertical slice"
          git push origin HEAD:unity-v2
