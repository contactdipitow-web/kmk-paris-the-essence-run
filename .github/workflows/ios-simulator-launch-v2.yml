name: Launch KMK Paris on iOS Simulator V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-simulator-launch-v2.yml"

permissions:
  contents: read

concurrency:
  group: kmk-ios-simulator-launch-v2
  cancel-in-progress: false

jobs:
  launch-ios:
    name: Compile, install and open KMK on iPhone
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_GIT_STATUS: "1"
      BUNDLE_ID: com.kmkparis.theessencerun
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and generate lock file
        run: npm install --no-audit --no-fund

      - name: Validate project
        run: |
          npx tsc --noEmit
          npx expo-doctor@latest

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Discover native project
        id: native
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE" || { echo "::error::No Xcode workspace generated"; exit 1; }
          xcodebuild -workspace "$WORKSPACE" -list -json > "$RUNNER_TEMP/xcode-list.json"
          SCHEME="$(python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'xcode-list.json')) as f:
              data = json.load(f)
          schemes = data.get('workspace', {}).get('schemes', [])
          if not schemes:
              raise SystemExit('No scheme found')
          print(schemes[0])
          PY
          )"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Select and boot iPhone
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          read -r UDID DEVICE_NAME RUNTIME <<< "$(python3 - <<'PY'
          import json, os, re
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'simulators.json')) as f:
              data = json.load(f)
          choices = []
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              version = tuple(map(int, match.groups())) if match else (0, 0)
              for d in devices:
                  name = d.get('name', '')
                  if d.get('isAvailable') and name.startswith('iPhone'):
                      rank = 2 if 'Pro Max' in name else 1 if 'Pro' in name else 0
                      choices.append((version, rank, name, d['udid'], runtime))
          if not choices:
              raise SystemExit('No available iPhone Simulator')
          _, _, name, udid, runtime = sorted(choices, reverse=True)[0]
          print(udid, name.replace(' ', '_'), runtime)
          PY
          )"
          DEVICE_NAME="${DEVICE_NAME//_/ }"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "Selected: $DEVICE_NAME / $RUNTIME"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build Release for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace "${{ steps.native.outputs.workspace }}" \
            -scheme "${{ steps.native.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            clean build | tee build/xcodebuild-ios-simulator.log

      - name: Install, launch and capture proof
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$DERIVED_DATA/Build/Products" -type d -name '*.app' -path '*Release-iphonesimulator*' -print -quit)"
          test -n "$APP_PATH" || { echo "::error::Compiled app bundle not found"; exit 1; }

          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "$APP_PATH"
          OUTPUT="$(xcrun simctl launch --terminate-running-process "${{ steps.simulator.outputs.udid }}" "$BUNDLE_ID")"
          echo "$OUTPUT"
          PID="$(echo "$OUTPUT" | awk -F': ' 'NF > 1 {print $2}' | tail -1)"
          test -n "$PID" || { echo "::error::No iOS process ID returned"; exit 1; }

          sleep 12
          mkdir -p build/ios-launch
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot build/ios-launch/kmk-paris-ios-launched.png
          ditto -c -k --keepParent "$APP_PATH" build/ios-launch/KMK-Paris-The-Essence-Run-iOS-Simulator.app.zip
          printf '%s\n' \
            "Status=LAUNCHED" \
            "Simulator=${{ steps.simulator.outputs.name }}" \
            "Runtime=${{ steps.simulator.outputs.runtime }}" \
            "BundleID=$BUNDLE_ID" \
            "PID=$PID" \
            "Commit=${{ github.sha }}" \
            > build/ios-launch/launch-proof.txt
          echo "pid=$PID" >> "$GITHUB_OUTPUT"

      - name: Write result summary
        if: success()
        shell: bash
        run: |
          {
            echo "## KMK Paris — iOS launch successful"
            echo "- Device: ${{ steps.simulator.outputs.name }}"
            echo "- Runtime: ${{ steps.simulator.outputs.runtime }}"
            echo "- Bundle: \`$BUNDLE_ID\`"
            echo "- Running process: \`${{ steps.launch.outputs.pid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app, screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmk-paris-ios-launch-v2
          path: |
            build/ios-launch/**
            build/xcodebuild-ios-simulator.log
          if-no-files-found: warn
          retention-days: 7

      - name: Shutdown Simulator
        if: always()
        shell: bash
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" 2>/dev/null || true
