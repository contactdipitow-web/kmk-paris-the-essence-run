name: Launch KMK Paris on iOS Simulator V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-simulator-launch-v3.yml"

permissions:
  contents: read

concurrency:
  group: kmk-ios-simulator-launch-v3
  cancel-in-progress: false

jobs:
  launch-ios:
    name: Compile, install and open KMK on iPhone
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_GIT_STATUS: "1"
      BUNDLE_ID: com.kmkparis.theessencerun
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project
        run: |
          npx tsc --noEmit
          npx expo-doctor@latest

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Discover native workspace and scheme
        id: native
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE" || { echo "::error::No Xcode workspace generated"; exit 1; }

          xcodebuild -workspace "$WORKSPACE" -list -json > "$RUNNER_TEMP/xcode-list.json"
          SCHEME="$(python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'xcode-list.json')) as handle:
              data = json.load(handle)
          schemes = data.get('workspace', {}).get('schemes', [])
          if not schemes:
              raise SystemExit('No Xcode scheme found')
          print(schemes[0])
          PY
          )"

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Select and boot an iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          read -r UDID DEVICE_NAME RUNTIME <<< "$(python3 - <<'PY'
          import json, os, re
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'simulators.json')) as handle:
              data = json.load(handle)

          choices = []
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              version = tuple(map(int, match.groups())) if match else (0, 0)
              for device in devices:
                  name = device.get('name', '')
                  if device.get('isAvailable') and name.startswith('iPhone'):
                      priority = 2 if 'Pro Max' in name else 1 if 'Pro' in name else 0
                      choices.append((version, priority, name, device['udid'], runtime))

          if not choices:
              raise SystemExit('No available iPhone Simulator found')

          _, _, name, udid, runtime = sorted(choices, reverse=True)[0]
          print(udid, name.replace(' ', '_'), runtime)
          PY
          )"

          DEVICE_NAME="${DEVICE_NAME//_/ }"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $DEVICE_NAME ($UDID), $RUNTIME"

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build Release app for Simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace "${{ steps.native.outputs.workspace }}" \
            -scheme "${{ steps.native.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            clean build | tee build/xcodebuild-ios-simulator.log

      - name: Locate KMK application bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS_DIR="$DERIVED_DATA/Build/Products/Release-iphonesimulator"
          test -d "$PRODUCTS_DIR" || { echo "::error::Release products directory not found"; exit 1; }

          APP_PATH=""
          while IFS= read -r candidate; do
            CANDIDATE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$candidate/Info.plist" 2>/dev/null || true)"
            echo "Candidate: $candidate | bundle: ${CANDIDATE_ID:-unknown}"
            if [ "$CANDIDATE_ID" = "$BUNDLE_ID" ]; then
              APP_PATH="$candidate"
              break
            fi
          done < <(find "$PRODUCTS_DIR" -maxdepth 5 -type d -name '*.app' -print)

          test -n "$APP_PATH" || {
            echo "::error::No compiled app matches bundle identifier $BUNDLE_ID"
            find "$PRODUCTS_DIR" -maxdepth 5 -type d -name '*.app' -print || true
            exit 1
          }

          mkdir -p build/ios-launch
          ditto -c -k --keepParent "$APP_PATH" build/ios-launch/KMK-Paris-The-Essence-Run-iOS-Simulator.app.zip
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Main app: $APP_PATH"

      - name: Install, launch and capture proof
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          APP_PATH="${{ steps.bundle.outputs.app_path }}"
          mkdir -p build/ios-launch

          xcrun simctl uninstall "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl install "$UDID" "$APP_PATH"

          INSTALLED_PATH="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" app)"
          echo "Installed container: $INSTALLED_PATH"
          test -d "$INSTALLED_PATH" || { echo "::error::Application installation could not be verified"; exit 1; }

          set +e
          LAUNCH_OUTPUT="$(xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" 2>&1)"
          LAUNCH_STATUS=$?
          set -e
          echo "$LAUNCH_OUTPUT"

          if [ "$LAUNCH_STATUS" -ne 0 ]; then
            echo "$LAUNCH_OUTPUT" > build/ios-launch/launch-error.txt
            xcrun simctl spawn "$UDID" log show --last 3m --style compact \
              --predicate "eventMessage CONTAINS[c] '$BUNDLE_ID' OR processImagePath CONTAINS[c] 'KMK'" \
              > build/ios-launch/simulator-error.log 2>&1 || true
            echo "::error::simctl launch failed with status $LAUNCH_STATUS"
            exit "$LAUNCH_STATUS"
          fi

          PID="$(printf '%s\n' "$LAUNCH_OUTPUT" | sed -nE 's/^.*: ([0-9]+)$/\1/p' | tail -1)"
          echo "pid=${PID:-unknown}" >> "$GITHUB_OUTPUT"

          sleep 12
          xcrun simctl spawn "$UDID" log show --last 2m --style compact \
            --predicate "eventMessage CONTAINS[c] '$BUNDLE_ID' OR processImagePath CONTAINS[c] 'KMK'" \
            > build/ios-launch/simulator-launch.log 2>&1 || true

          xcrun simctl io "$UDID" screenshot build/ios-launch/kmk-paris-ios-launched.png || {
            echo "::warning::The app launched, but Simulator screenshot capture was unavailable"
          }

          printf '%s\n' \
            "Status=LAUNCHED" \
            "Simulator=${{ steps.simulator.outputs.name }}" \
            "Runtime=${{ steps.simulator.outputs.runtime }}" \
            "BundleID=$BUNDLE_ID" \
            "PID=${PID:-unknown}" \
            "InstalledPath=$INSTALLED_PATH" \
            "Commit=${{ github.sha }}" \
            > build/ios-launch/launch-proof.txt

      - name: Publish result
        if: success()
        shell: bash
        run: |
          {
            echo "## KMK Paris — iOS launch successful"
            echo "- Result: compiled, installed and launched"
            echo "- Device: ${{ steps.simulator.outputs.name }}"
            echo "- Runtime: ${{ steps.simulator.outputs.runtime }}"
            echo "- Bundle ID: \`$BUNDLE_ID\`"
            echo "- Process ID: \`${{ steps.launch.outputs.pid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app, screenshot, proof and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmk-paris-ios-launch-v3
          path: |
            build/ios-launch/**
            build/xcodebuild-ios-simulator.log
          if-no-files-found: warn
          retention-days: 7

      - name: Shutdown Simulator
        if: always()
        shell: bash
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" 2>/dev/null || true
